<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Login | Anyone Anytime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full border border-gray-100">
        <div class="text-center mb-8">
            <img src="images/logo.png" alt="Anyone Anytime" class="h-16 w-16 mx-auto mb-4 rounded-full shadow-sm">
            <h1 class="text-2xl font-bold text-gray-900">Seller Login</h1>
            <p class="text-sm text-gray-500 mt-1">Manage orders and inventory</p>
        </div>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="text" value="admin@anyoneanytime.com" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 px-3 focus:outline-none text-sm" disabled>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required placeholder="Enter password (admin123)" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-[#800000] text-sm">
            </div>
            <p id="error-msg" class="text-red-500 text-sm hidden"></p>
            <button type="submit" class="w-full brand-bg text-white font-bold py-3 rounded-lg flex items-center justify-center btn-hover shadow-md mt-4">
                Login
            </button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.token) {
                    sessionStorage.setItem('sellerToken', data.token);
                    window.location.href = 'seller.html';
                } else {
                    document.getElementById('error-msg').textContent = 'Invalid credentials';
                    document.getElementById('error-msg').classList.remove('hidden');
                }
            } catch (err) {
                document.getElementById('error-msg').textContent = 'Server error';
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
