<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Anyone Anytime Seller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        if (!sessionStorage.getItem('sellerToken')) {
            window.location.href = 'seller-login.html';
        }
    </script>
</head>
<body class="bg-gray-50 flex flex-col md:flex-row min-h-screen">
    
    <!-- Sidebar -->
    <aside class="bg-white border-r border-gray-200 w-full md:w-64 flex-shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-gray-100">
            <img src="images/logo.png" alt="Logo" class="h-8 w-8 rounded-full mr-2">
            <span class="font-bold text-gray-900">Seller Panel</span>
        </div>
        <nav class="p-4 space-y-1">
            <button class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium brand-bg text-white" data-target="orders">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                Incoming Orders
            </button>
            <button class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100" data-target="inventory">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                Inventory
            </button>
            <button class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100" data-target="history">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                Order History
            </button>
            <button class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100" data-target="sales">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
                Sales Report
            </button>
        </nav>
        <div class="p-4 mt-auto border-t border-gray-100 relative w-full"></div>
            <button onclick="sessionStorage.clear(); window.location.href='seller-login.html'" class="w-full flex items-center gap-3 px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto pb-20 md:pb-0">
        <header class="bg-white shadow-sm h-16 flex items-center px-6 sticky top-0 z-10">
            <h2 id="page-title" class="text-xl font-bold text-gray-900">Incoming Orders</h2>
        </header>

        <div class="p-4 sm:p-6 lg:p-8" id="main-content">
            <!-- Summary Cards -->
            <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-8" id="summary-cards">
                <!-- Injected via JS -->
            </div>

            <!-- View Container -->
            <div id="view-container">
                <!-- Injected via JS -->
            </div>
        </div>
    </main>

    <!-- Rejection Reason Modal -->
    <div id="reject-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <!-- Backdrop -->
        <div id="reject-backdrop" class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
        <!-- Dialog -->
        <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 p-6 z-10">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <div>
                    <h3 class="text-base font-bold text-gray-900">Reject Order</h3>
                    <p class="text-xs text-gray-500">The customer will see this reason.</p>
                </div>
            </div>

            <!-- Quick reason chips -->
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Quick Select</p>
            <div class="flex flex-wrap gap-2 mb-4" id="reject-chips">
                <button onclick="selectRejectReason('Out of stock')" class="chip text-xs px-3 py-1.5 rounded-full border border-gray-200 hover:border-[#800000] hover:text-[#800000] transition-colors">Out of stock</button>
                <button onclick="selectRejectReason('Store is closed')" class="chip text-xs px-3 py-1.5 rounded-full border border-gray-200 hover:border-[#800000] hover:text-[#800000] transition-colors">Store is closed</button>
                <button onclick="selectRejectReason('Item unavailable today')" class="chip text-xs px-3 py-1.5 rounded-full border border-gray-200 hover:border-[#800000] hover:text-[#800000] transition-colors">Item unavailable today</button>
                <button onclick="selectRejectReason('Delivery not available to your block')" class="chip text-xs px-3 py-1.5 rounded-full border border-gray-200 hover:border-[#800000] hover:text-[#800000] transition-colors">Block not serviceable</button>
            </div>

            <!-- Custom reason textarea -->
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Or Type a Reason</p>
            <textarea id="reject-reason-input" rows="3" placeholder="Enter the reason for rejection..."
                class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-800 focus:outline-none focus:ring-2 focus:ring-red-400 resize-none"></textarea>

            <!-- Buttons -->
            <div class="flex gap-3 mt-5">
                <button id="reject-cancel-btn" onclick="closeRejectModal()" class="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">Cancel</button>
                <button id="reject-confirm-btn" onclick="confirmReject()" class="flex-1 py-2.5 rounded-xl bg-red-600 text-white text-sm font-bold hover:bg-red-700 transition-colors">Confirm Rejection</button>
            </div>
        </div>
    </div>

    <script>
        let _pendingRejectOrderId = null;

        window.openRejectModal = function(orderId) {
            _pendingRejectOrderId = orderId;
            const textarea = document.getElementById('reject-reason-input');
            textarea.value = '';
            textarea.classList.remove('border-red-400');
            textarea.placeholder = 'Enter the reason for rejection...';
            document.getElementById('reject-modal').classList.remove('hidden');
            setTimeout(() => textarea.focus(), 150);
        };

        window.closeRejectModal = function() {
            document.getElementById('reject-modal').classList.add('hidden');
            _pendingRejectOrderId = null;
        };

        window.selectRejectReason = function(reason) {
            document.getElementById('reject-reason-input').value = reason;
        };

        window.confirmReject = function() {
            const reason = document.getElementById('reject-reason-input').value.trim();
            if (!reason) {
                document.getElementById('reject-reason-input').classList.add('border-red-400');
                document.getElementById('reject-reason-input').placeholder = 'Please enter a reason before rejecting.';
                return;
            }
            document.getElementById('reject-reason-input').classList.remove('border-red-400');
            // Capture the ID BEFORE closeRejectModal sets it to null
            const orderId = _pendingRejectOrderId;
            closeRejectModal();
            window._doReject(orderId, reason);
        };

        // Only close when clicking the dark overlay behind the dialog — NOT clicks inside the dialog
        document.getElementById('reject-modal').addEventListener('click', function(e) {
            if (e.target === this || e.target === document.getElementById('reject-backdrop')) {
                closeRejectModal();
            }
        });

        // Also close on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeRejectModal();
                if (window.closeDeleteModal) window.closeDeleteModal();
            }
        });

        // ------------------ Delete Modal Logic ------------------
        let _pendingDeleteProductId = null;

        window.openDeleteModal = function(productId, productName) {
            _pendingDeleteProductId = productId;
            document.getElementById('delete-product-name').textContent = productName;
            document.getElementById('delete-modal').classList.remove('hidden');
        };

        window.closeDeleteModal = function() {
            document.getElementById('delete-modal').classList.add('hidden');
            _pendingDeleteProductId = null;
        };

        window.confirmDelete = function() {
            if (_pendingDeleteProductId) {
                window._doDelete(_pendingDeleteProductId);
            }
            closeDeleteModal();
        };

        // Initialize Delete Backdrop listener once the element exists
        document.addEventListener('DOMContentLoaded', () => {
            const deleteModal = document.getElementById('delete-modal');
            const deleteBackdrop = document.getElementById('delete-backdrop');
            if(deleteModal) {
                deleteModal.addEventListener('click', function(e) {
                    if (e.target === this || e.target === deleteBackdrop) {
                        closeDeleteModal();
                    }
                });
            }
        });
    </script>

    <!-- Delete Product Modal -->
    <div id="delete-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <!-- Backdrop -->
        <div id="delete-backdrop" class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
        <!-- Dialog -->
        <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-6 z-10">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                </div>
                <div>
                    <h3 class="text-base font-bold text-gray-900">Delete Product</h3>
                </div>
            </div>
            
            <p class="text-sm text-gray-600 mb-6">
                Are you sure you want to completely delete <strong id="delete-product-name" class="text-gray-900"></strong>? This action cannot be undone.
            </p>

            <!-- Buttons -->
            <div class="flex gap-3 mt-2">
                <button onclick="closeDeleteModal()" class="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors">Cancel</button>
                <button onclick="confirmDelete()" class="flex-1 py-2.5 rounded-xl bg-red-600 text-white text-sm font-bold hover:bg-red-700 transition-colors">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/seller.js"></script>
</body>
</html>
